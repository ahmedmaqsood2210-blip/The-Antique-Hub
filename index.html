<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Antique Hub | Timeless Treasures</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #121212; color: #f5f5f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        header { text-align: center; padding: 40px 20px; background-color: #1a1a1a; border-bottom: 2px solid #D4AF37; }
        header h1 { color: #D4AF37; font-size: 2.5rem; margin-bottom: 10px; letter-spacing: 2px; }
        header p { color: #aaa; font-size: 1.1rem; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; overflow: hidden; transition: transform 0.3s ease, border-color 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:hover { transform: translateY(-5px); border-color: #D4AF37; }
        .product-card img { width: 100%; height: 300px; object-fit: cover; display: block; }
        .product-info { padding: 20px; text-align: center; }
        .product-title { color: #D4AF37; font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; }
        .product-price { color: #f5f5f5; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; }
        .whatsapp-btn { display: inline-block; background-color: #25D366; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; transition: background 0.3s ease; }
        .whatsapp-btn:hover { background-color: #1ebe5d; }
        footer { text-align: center; padding: 20px; background-color: #1a1a1a; color: #777; margin-top: 60px; border-top: 1px solid #333; }
    </style>
</head>
